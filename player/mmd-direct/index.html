<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原版 MMD 直读播放器 - Endfield 风格近似</title>
<style>
  * { box-sizing: border-box; } html,body { margin:0; height:100%; background:#161922; color:#dfe3ea;
    font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { position:fixed; inset:0; }
  #bar { position:fixed; top:0; left:0; right:0; height:46px; display:flex; gap:10px; align-items:center;
    padding:0 12px; background:rgba(20,22,27,.85); border-bottom:1px solid #2a2e36; z-index:20; }
  #bar button, #bar select { background:#22262e; color:#dfe3ea; border:1px solid #333a44; border-radius:8px;
    padding:6px 10px; cursor:pointer; font-size:13px; }
  #bar button:hover { background:#2c323c; }
  #bar label { font-size:13px; color:#9aa0ab; }
  #status { position:fixed; left:50%; top:54px; transform:translateX(-50%); color:#9aa0ab; font-size:13px; z-index:20; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
  <div id="app"></div>
  <div id="bar">
    <button id="play" class="primary">暂停</button>
    <label>动作</label>
    <select id="vmd">
      <option value="tda">daybyday tda 通用版</option>
      <option value="yyb">daybyday yyb 版</option>
    </select>
    <label><input type="checkbox" id="cam" checked /> 原始镜头VMD</label>
  </div>
  <div id="status">加载中…</div>
  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from './vendor/OrbitControls.js';
  import { MMDLoader } from './vendor/jsm/loaders/MMDLoader.js';
  import { MMDAnimationHelper } from './vendor/jsm/animation/MMDAnimationHelper.js';

  const statusEl = document.getElementById('status');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.getElementById('app').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b1e26);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // 自然棚拍三点光 (Endfield 观感由材质 rim/SSS 增强)
  scene.add(new THREE.HemisphereLight(0xbfd0ff, 0x2a2620, 0.85));
  const key = new THREE.DirectionalLight(0xffffff, 1.45); key.position.set(6, 18, 12); scene.add(key);
  const fill = new THREE.DirectionalLight(0xbcd2ff, 0.45); fill.position.set(-12, 6, -8); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffe6d8, 0.55); rim.position.set(0, 8, -16); scene.add(rim);

  const helper = new MMDAnimationHelper({ afterglow: 0.0 });
  const loader = new MMDLoader();
  const params = new URLSearchParams(location.search);
  const modelParam = params.get('model');
  const vmdParam = params.get('vmd');
  const DEFAULT_MODEL = 'Norma/诺姆1.pmx';
  const MODEL = 'models/' + (modelParam ? modelParam : DEFAULT_MODEL);
  const VMDS = {
    tda: 'models/' + encodeURIComponent('daybyday适用tda等通用版本.vmd'),
    yyb: 'models/' + encodeURIComponent('daybyday适用yyb版.vmd')
  };
  const CAM_VMD = 'models/' + encodeURIComponent('镜头.vmd');
  const clock = new THREE.Clock();
  let mesh = null, playing = true, cameraOn = true;
  let meshAdded = false, cameraAdded = false;

  // ---- Endfield 风格近似材质 ----
  const CAT = {
    skin:  { rim: 0xffd2c8, rimStrength: 0.55, rimPower: 3.0, sss: 0xffb0a0, sssStrength: 1.0, spec: 0.18, rough: 0.74 },
    hair:  { rim: 0xd9e6ff, rimStrength: 0.85, rimPower: 2.6, sss: 0x000000, sssStrength: 0.0, spec: 0.22, rough: 0.60 },
    cloth: { rim: 0xfff0e2, rimStrength: 0.45, rimPower: 3.6, sss: 0x000000, sssStrength: 0.0, spec: 0.28, rough: 0.72 }
  };
  function classify(srcMat) {
    const url = (srcMat && srcMat.map && srcMat.map.image && (srcMat.map.image.currentSrc || srcMat.map.image.src)) || '';
    if (/hair/i.test(url)) return 'hair';
    if (/cloth/i.test(url)) return 'cloth';
    return 'skin';
  }
  function makeEndfieldMaterial(s) {
    const catName = classify(s);
    const c = CAT[catName];
    const m = new THREE.MeshStandardMaterial({
      map: (s && s.map) ? s.map : null,
      color: (s && s.color) ? s.color.clone() : new THREE.Color(0xffffff),
      transparent: !!(s && s.transparent), opacity: (s && s.opacity != null ? s.opacity : 1),
      side: (s && s.side) ? s.side : THREE.DoubleSide,
      roughness: c.rough, metalness: 0.0
    });
    m.onBeforeCompile = (shader) => {
      shader.uniforms.uRimColor = { value: new THREE.Color(c.rim) };
      shader.uniforms.uRimStrength = { value: c.rimStrength };
      shader.uniforms.uRimPower = { value: c.rimPower };
      shader.uniforms.uSSSColor = { value: new THREE.Color(c.sss) };
      shader.uniforms.uSSSStrength = { value: c.sssStrength };
      shader.uniforms.uSpecStrength = { value: c.spec };
      shader.uniforms.uIsSkin = { value: catName === 'skin' ? 1.0 : 0.0 };
      shader.uniforms.uIsCloth = { value: catName === 'cloth' ? 1.0 : 0.0 };
      shader.fragmentShader = 'uniform vec3 uRimColor; uniform float uRimStrength; uniform float uRimPower;\n'
        + 'uniform vec3 uSSSColor; uniform float uSSSStrength; uniform float uSpecStrength;\n'
        + 'uniform float uIsSkin; uniform float uIsCloth;\n'
        + shader.fragmentShader;
      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <lights_fragment_end>',
        '#include <lights_fragment_end>\n  {\n'
        + '    vec3 vN = normalize( normal );\n'
        + '    vec3 vV = normalize( vViewPosition );\n'
        + '    float ndv = clamp( dot( vN, vV ), 0.0, 1.0 );\n'
        + '    float rim = pow( 1.0 - ndv, uRimPower );\n'
        + '    totalEmissiveRadiance += uRimColor * uRimStrength * rim;\n'
        + '    if ( uIsSkin > 0.5 ) {\n'
        + '      totalEmissiveRadiance += uSSSColor * uSSSStrength * (1.0 - ndv) * 0.18;\n'
        + '    }\n'
        + '    if ( uIsCloth > 0.5 ) {\n'
        + '      float m = pow( ndv, 3.0 );\n'
        + '      totalEmissiveRadiance += vec3(0.05,0.05,0.06) * m * uSpecStrength;\n'
        + '    }\n'
        + '  }'
      );
    };
    m.customProgramCacheKey = () => 'endfield-' + catName;
    return m;
  }

  loader.load(MODEL, (mmd) => {
    mesh = mmd;
    mmd.traverse((o) => {
      if (o.isMesh && o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        const out = mats.map((s) => makeEndfieldMaterial(s));
        o.material = Array.isArray(o.material) ? out : out[0];
      }
    });
    scene.add(mmd);
    const box = new THREE.Box3().setFromObject(mmd);
    const c = box.getCenter(new THREE.Vector3());
    const len = box.getSize(new THREE.Vector3()).length();
    controls.target.copy(c);
    camera.position.set(c.x + len * 0.35, c.y + len * 0.08, c.z + len * 0.95);
    controls.update();
    const autoDefault = !modelParam && DEFAULT_MODEL === '提弗洛斯.pmx';
    if (vmdParam) {
      loader.loadAnimation('models/' + vmdParam, mesh, (anim) => {
        helper.add(mesh, { animation: anim, physics: true }); meshAdded = true; playing = true;
        document.getElementById('play').textContent = '暂停';
      });
    } else if (autoDefault) {
      setMotion('tda');
    }
    if (cameraOn && autoDefault) addCamera();
    statusEl.textContent = '模型已加载 — 播放中';
    animate();
  }, (x) => { if (x.total) statusEl.textContent = '加载模型 ' + Math.round(x.loaded/x.total*100) + '%'; },
     (e) => { statusEl.textContent = '模型加载失败: ' + e; console.error(e); });

  function setMotion(key) {
    if (!mesh) return;
    if (meshAdded) helper.remove(mesh);
    loader.loadAnimation(VMDS[key], mesh, (anim) => {
      helper.add(mesh, { animation: anim, physics: true });
      meshAdded = true;
      playing = true; document.getElementById('play').textContent = '暂停';
    });
  }
  function addCamera() {
    loader.loadAnimation(CAM_VMD, camera, (a) => { helper.add(camera, { animation: a }); cameraAdded = true; controls.enabled = false; });
  }

  document.getElementById('play').onclick = () => {
    playing = !playing; document.getElementById('play').textContent = playing ? '暂停' : '播放';
  };
  document.getElementById('vmd').onchange = (e) => setMotion(e.target.value);
  document.getElementById('cam').onchange = (e) => {
    cameraOn = e.target.checked;
    if (cameraOn) { if (!modelParam) addCamera(); }
    else { if (cameraAdded) helper.remove(camera); cameraAdded = false; controls.enabled = true; }
  };
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    if (playing) helper.update(dt);
    controls.update();
    renderer.render(scene, camera);
  }
  </script>
</body>
</html>
